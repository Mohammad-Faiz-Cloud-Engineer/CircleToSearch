<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 450" width="1240" height="450" style="background:#0D1117; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38BDF8" />
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#818CF8" />
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748B" />
    </marker>

    <!-- Ambient Mesh Glows -->
    <radialGradient id="ambient-left" cx="20%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ambient-right" cx="75%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>

    <!-- Container Gradient Backgrounds -->
    <linearGradient id="ui-container-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161822" />
      <stop offset="100%" stop-color="#10121A" />
    </linearGradient>
    <linearGradient id="service-container-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111B27" />
      <stop offset="100%" stop-color="#0E1520" />
    </linearGradient>

    <!-- Header Gradients -->
    <linearGradient id="ui-header-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#282246" />
      <stop offset="70%" stop-color="#1B1C28" />
      <stop offset="100%" stop-color="#161822" />
    </linearGradient>
    <linearGradient id="service-header-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#163148" />
      <stop offset="70%" stop-color="#132435" />
      <stop offset="100%" stop-color="#111B27" />
    </linearGradient>

    <!-- Header Accent Strips -->
    <linearGradient id="ui-accent-strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="service-accent-strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Card/Node Gradient Fills -->
    <linearGradient id="card-ui-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#222533" />
      <stop offset="100%" stop-color="#181A24" />
    </linearGradient>
    <linearGradient id="card-service-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#182333" />
      <stop offset="100%" stop-color="#111924" />
    </linearGradient>

    <!-- Card Border Stroke Gradients -->
    <linearGradient id="card-ui-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#262A3B" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="card-service-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#0D9488" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8" />
    </linearGradient>

    <!-- Google 4-Color Gradient -->
    <linearGradient id="google-lens-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="33%" stop-color="#EA4335" />
      <stop offset="66%" stop-color="#FBBC05" />
      <stop offset="100%" stop-color="#34A853" />
    </linearGradient>

    <!-- Flow Connecting Stroke -->
    <linearGradient id="flow-grad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow Backdrops -->
  <rect x="0" y="0" width="1240" height="450" fill="url(#ambient-left)" />
  <rect x="0" y="0" width="1240" height="450" fill="url(#ambient-right)" />

  <!-- ======================== LEFT CONTAINER: UI & SETTINGS LAYER ======================== -->
  <g id="ui-layer">
    <!-- Container Body -->
    <rect x="30" y="25" width="330" height="400" rx="14" fill="url(#ui-container-bg)" stroke="#2B2F42" stroke-width="1.2" />
    <!-- Header Background with Gradient -->
    <path d="M 30,39 Q 30,25 44,25 L 346,25 Q 360,25 360,39 L 360,65 L 30,65 Z" fill="url(#ui-header-bg)" stroke="#2B2F42" stroke-width="1.2" />
    <!-- Luminous Top Accent Strip -->
    <path d="M 44,25 L 346,25" stroke="url(#ui-accent-strip)" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Header Indicator Dot & Title -->
    <circle cx="50" cy="45" r="5" fill="#818CF8" />
    <text x="64" y="49" font-size="12" font-weight="600" fill="#F8FAFC" letter-spacing="0.3">UI &amp; Settings Layer (Jetpack Compose)</text>

    <!-- Card 1: MainActivity.kt -->
    <g id="card-ma">
      <rect x="50" y="85" width="290" height="64" rx="10" fill="url(#card-ui-grad)" stroke="url(#card-ui-stroke)" stroke-width="1.2" />
      <rect x="50" y="85" width="4" height="64" rx="2" fill="#60A5FA" />
      <text x="68" y="110" font-size="13" font-weight="600" fill="#FFFFFF">MainActivity.kt</text>
      <text x="68" y="128" font-size="11" font-weight="400" fill="#94A3B8">Compose Settings UI &amp; live size preview</text>
      <text x="68" y="141" font-size="10" font-weight="500" fill="#38BDF8">Adaptive layout · Edge-to-edge</text>
    </g>

    <!-- Connector: MA -> SVM -->
    <line x1="195" y1="149" x2="195" y2="195" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow-muted)" />
    <rect x="168" y="163" width="54" height="18" rx="5" fill="#13151D" stroke="#33384B" stroke-width="0.8" />
    <text x="195" y="176" font-size="9.5" font-weight="500" fill="#94A3B8" text-anchor="middle">observes</text>

    <!-- Card 2: SettingsViewModel.kt -->
    <g id="card-svm">
      <rect x="50" y="195" width="290" height="60" rx="10" fill="url(#card-ui-grad)" stroke="url(#card-ui-stroke)" stroke-width="1.2" />
      <rect x="50" y="195" width="4" height="60" rx="2" fill="#818CF8" />
      <text x="68" y="219" font-size="13" font-weight="600" fill="#FFFFFF">SettingsViewModel.kt</text>
      <text x="68" y="238" font-size="11" font-weight="400" fill="#94A3B8">StateFlow holder (WhileSubscribed 5s)</text>
    </g>

    <!-- Connector: SVM -> SR -->
    <line x1="195" y1="255" x2="195" y2="300" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow-muted)" />
    <rect x="156" y="269" width="78" height="18" rx="5" fill="#13151D" stroke="#33384B" stroke-width="0.8" />
    <text x="195" y="282" font-size="9.5" font-weight="500" fill="#94A3B8" text-anchor="middle">reads / writes</text>

    <!-- Card 3: SettingsRepository.kt -->
    <g id="card-sr">
      <rect x="50" y="300" width="290" height="72" rx="10" fill="url(#card-ui-grad)" stroke="url(#card-ui-stroke)" stroke-width="1.2" />
      <rect x="50" y="300" width="4" height="72" rx="2" fill="#34D399" />
      <text x="68" y="324" font-size="13" font-weight="600" fill="#FFFFFF">SettingsRepository.kt</text>
      <text x="68" y="343" font-size="11" font-weight="400" fill="#94A3B8">Preferences DataStore (IOException safe)</text>
      <text x="68" y="358" font-size="10" font-weight="500" fill="#34D399">Stores: enabled, size (32-96dp), X/Y fractions</text>
    </g>
  </g>

  <!-- ======================== INTER-LAYER FLOW CONNECTOR ======================== -->
  <path d="M 340,336 L 375,336 L 375,117 L 398,117" fill="none" stroke="url(#flow-grad)" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrow-cyan)" />
  <rect x="348" y="215" width="54" height="25" rx="5" fill="#0F141C" stroke="#2563EB" stroke-width="0.9" />
  <text x="375" y="228" font-size="9" font-weight="600" fill="#60A5FA" text-anchor="middle">settings</text>
  <text x="375" y="237" font-size="8" font-weight="500" fill="#94A3B8" text-anchor="middle">flow</text>

  <!-- ======================== RIGHT CONTAINER: SERVICE & CAPTURE PIPELINE ======================== -->
  <g id="service-layer">
    <!-- Container Body -->
    <rect x="400" y="25" width="810" height="400" rx="14" fill="url(#service-container-bg)" stroke="#1F3347" stroke-width="1.2" />
    <!-- Header Background with Gradient -->
    <path d="M 400,39 Q 400,25 414,25 L 1196,25 Q 1210,25 1210,39 L 1210,65 L 400,65 Z" fill="url(#service-header-bg)" stroke="#1F3347" stroke-width="1.2" />
    <!-- Luminous Top Accent Strip -->
    <path d="M 414,25 L 1196,25" stroke="url(#service-accent-strip)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Header Indicator Dot & Title -->
    <circle cx="420" cy="45" r="5" fill="#38BDF8" />
    <text x="434" y="49" font-size="12" font-weight="600" fill="#F8FAFC" letter-spacing="0.3">Background Accessibility Service &amp; Screen Capture Pipeline</text>

    <!-- Top Row: Step 1 -> Step 2 -> Step 3 -->

    <!-- Step 1: BallAccessibilityService -->
    <g id="step1">
      <rect x="420" y="85" width="225" height="74" rx="10" fill="url(#card-service-grad)" stroke="url(#card-service-stroke)" stroke-width="1.2" />
      <rect x="420" y="85" width="4" height="74" rx="2" fill="#0EA5E9" />
      <text x="436" y="109" font-size="12.5" font-weight="600" fill="#FFFFFF">BallAccessibilityService</text>
      <text x="436" y="128" font-size="10.5" font-weight="400" fill="#94A3B8">Overlay &amp; gesture controller</text>
      <text x="436" y="145" font-size="10" font-weight="500" fill="#38BDF8">TYPE_ACCESSIBILITY_OVERLAY</text>
    </g>

    <line x1="645" y1="122" x2="683" y2="122" stroke="#38BDF8" stroke-width="1.4" marker-end="url(#arrow-cyan)" />
    <text x="664" y="114" font-size="9" font-weight="600" fill="#94A3B8" text-anchor="middle">renders</text>

    <!-- Step 2: Floating Ball Overlay -->
    <g id="step2">
      <rect x="685" y="85" width="225" height="74" rx="10" fill="url(#card-service-grad)" stroke="url(#card-service-stroke)" stroke-width="1.2" />
      <rect x="685" y="85" width="4" height="74" rx="2" fill="#F59E0B" />
      <text x="701" y="109" font-size="12.5" font-weight="600" fill="#FFFFFF">Floating Draggable Ball</text>
      <text x="701" y="128" font-size="10.5" font-weight="400" fill="#94A3B8">Edge snap · Gesture exclusion</text>
      <text x="701" y="145" font-size="10" font-weight="500" fill="#FBBF24">2s inactivity auto-dock &amp; dim</text>
    </g>

    <line x1="910" y1="122" x2="948" y2="122" stroke="#38BDF8" stroke-width="1.4" marker-end="url(#arrow-cyan)" />
    <text x="929" y="114" font-size="9" font-weight="600" fill="#94A3B8" text-anchor="middle">tap</text>

    <!-- Step 3: Screen Capture Engine -->
    <g id="step3">
      <rect x="950" y="85" width="240" height="74" rx="10" fill="url(#card-service-grad)" stroke="url(#card-service-stroke)" stroke-width="1.2" />
      <rect x="950" y="85" width="4" height="74" rx="2" fill="#10B981" />
      <text x="966" y="109" font-size="12.5" font-weight="600" fill="#FFFFFF">Screen Capture Engine</text>
      <text x="966" y="128" font-size="10.5" font-weight="400" fill="#94A3B8">takeScreenshot API</text>
      <text x="966" y="145" font-size="10" font-weight="500" fill="#34D399">HardwareBuffer · Blank/DRM check</text>
    </g>

    <!-- Turnaround Edge: Step 3 down to Step 4 -->
    <path d="M 1070,159 L 1070,225" fill="none" stroke="#38BDF8" stroke-width="1.4" marker-end="url(#arrow-cyan)" />
    <rect x="1025" y="183" width="90" height="18" rx="5" fill="#0C131D" stroke="#1E293B" stroke-width="0.8" />
    <text x="1070" y="196" font-size="9" font-weight="500" fill="#94A3B8" text-anchor="middle">mounts overlay</text>

    <!-- Bottom Row: Step 4 -> Step 5 -> Step 6 (Right to Left) -->

    <!-- Step 4: CircleSelectionView -->
    <g id="step4">
      <rect x="950" y="225" width="240" height="74" rx="10" fill="url(#card-service-grad)" stroke="url(#card-service-stroke)" stroke-width="1.2" />
      <rect x="950" y="225" width="4" height="74" rx="2" fill="#818CF8" />
      <text x="966" y="249" font-size="12.5" font-weight="600" fill="#FFFFFF">CircleSelectionView.kt</text>
      <text x="966" y="268" font-size="10.5" font-weight="400" fill="#94A3B8">120Hz smooth lasso touch drawing</text>
      <text x="966" y="285" font-size="10" font-weight="500" fill="#818CF8">Zero-allocation · Dimmed canvas</text>
    </g>

    <line x1="950" y1="262" x2="912" y2="262" stroke="#38BDF8" stroke-width="1.4" marker-end="url(#arrow-cyan)" />
    <text x="931" y="254" font-size="9" font-weight="600" fill="#94A3B8" text-anchor="middle">crops</text>

    <!-- Step 5: Cropped PNG Cache -->
    <g id="step5">
      <rect x="685" y="225" width="225" height="74" rx="10" fill="url(#card-service-grad)" stroke="url(#card-service-stroke)" stroke-width="1.2" />
      <rect x="685" y="225" width="4" height="74" rx="2" fill="#F472B6" />
      <text x="701" y="249" font-size="12.5" font-weight="600" fill="#FFFFFF">Padded Crop Bitmap</text>
      <text x="701" y="268" font-size="10.5" font-weight="400" fill="#94A3B8">cacheDir/lens/crop-*.png</text>
      <text x="701" y="285" font-size="10" font-weight="500" fill="#F472B6">60s auto-delete · Screen-off wipe</text>
    </g>

    <line x1="685" y1="262" x2="647" y2="262" stroke="#38BDF8" stroke-width="1.4" marker-end="url(#arrow-cyan)" />
    <text x="666" y="254" font-size="9" font-weight="600" fill="#94A3B8" text-anchor="middle">shares</text>

    <!-- Step 6: Google Lens / Chooser -->
    <g id="step6">
      <rect x="420" y="225" width="225" height="74" rx="10" fill="url(#card-service-grad)" stroke="url(#card-service-stroke)" stroke-width="1.2" />
      <rect x="420" y="225" width="4" height="74" rx="2" fill="url(#google-lens-grad)" />
      <rect x="436" y="238" width="16" height="3" rx="1.5" fill="url(#google-lens-grad)" />
      <text x="458" y="249" font-size="12.5" font-weight="600" fill="#FFFFFF">Google Lens / Intent</text>
      <text x="436" y="268" font-size="10.5" font-weight="400" fill="#94A3B8">ACTION_SEND via FileProvider</text>
      <text x="436" y="285" font-size="10" font-weight="500" fill="#38BDF8">Direct to Lens · Chooser fallback</text>
    </g>

    <!-- Security & Privacy Banner with Glowing Accent -->
    <rect x="420" y="325" width="770" height="48" rx="10" fill="#0D141E" stroke="#162333" stroke-width="1" />
    <circle cx="438" cy="349" r="6" fill="#10B981" />
    <text x="452" y="344" font-size="11" font-weight="600" fill="#F8FAFC">Zero-Tracking &amp; Offline Privacy Model</text>
    <text x="452" y="360" font-size="10" font-weight="400" fill="#94A3B8">No internet permission · In-memory full capture · Padded crop only written to private cache · Zero cloud/device data extraction</text>
  </g>
</svg>
